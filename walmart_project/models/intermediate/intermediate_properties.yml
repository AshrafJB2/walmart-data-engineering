
version: 2

models:
  - name: int_order_items_enriched
    description: "Order items enriched with order and product attributes."
    columns:
      - name: order_item_id
        data_tests:
          - unique
          - not_null

  - name: int_orders_with_totals
    description: "One row per order with item-level totals aggregated."
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
